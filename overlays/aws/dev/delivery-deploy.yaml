---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nautible-app-ms-delivery
  namespace: nautible-app-ms
spec:
  template:
    spec:
      containers:
      - name: nautible-app-ms-delivery
        image: public.ecr.aws/nautible/nautible-app-ms-delivery:5005a046175758cb9f615f163b16c25814a597ae
        env:
        - name: QUARKUS_PROFILE
          value: aws-dev
        - name: QUARKUS_DYNAMODB_AWS_REGION
          value: ap-northeast-1
      serviceAccount: nautible-app-ms-sa
      serviceAccountName: nautible-app-ms-sa